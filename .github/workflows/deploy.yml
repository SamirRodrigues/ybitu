# Publica o site no GitHub Pages a cada push na main (ou manualmente, na aba Actions).
#
# Antes do primeiro uso: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# O endereço do site vem de "Variables" do repositório (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL              padrão: https://samirrodrigues.github.io   (com domínio próprio: https://ybituolivro.com.br)
#   BASE_PATH             padrão: /ybitu                              (com domínio próprio: /)
#   PUBLIC_LEADS_ENDPOINT URL do Google Apps Script da lista de interessados (opcional até a planilha existir)
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Conferir tipos e textos nos dois idiomas
        run: npx astro check

      - name: Gerar o site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://samirrodrigues.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/ybitu' }}
          PUBLIC_LEADS_ENDPOINT: ${{ vars.PUBLIC_LEADS_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
